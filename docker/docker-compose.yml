services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a strong MariaDB root password in Coolify}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  frappe:
    image: frappe/bench:latest
    restart: on-failure:3
    user: root
    command:
      - bash
      - -lc
      - |
        set -e
        mkdir -p /home/frappe/frappe-bench
        chown -R frappe:frappe /home/frappe/frappe-bench
        ln -sf /home/frappe/.local/bin/bench /usr/local/bin/bench
        NODE_BIN="$$(find /home/frappe/.nvm/versions/node -maxdepth 2 -type f -name yarn -printf "%h\n" 2>/dev/null | sort -V | tail -n 1)"
        if [ -n "$${NODE_BIN}" ]; then
          ln -sf "$${NODE_BIN}/node" /usr/local/bin/node
          ln -sf "$${NODE_BIN}/npm" /usr/local/bin/npm
          ln -sf "$${NODE_BIN}/yarn" /usr/local/bin/yarn
        fi
        exec su frappe -s /bin/bash -c '
        set -e
        export HOME="/home/frappe"
        export NVM_DIR="$${NVM_DIR:-/home/frappe/.nvm}"
        if [ -s "$${NVM_DIR}/nvm.sh" ]; then
          . "$${NVM_DIR}/nvm.sh"
        fi
        NODE_BIN="$${NVM_DIR}/versions/node/v$${NODE_VERSION_DEVELOP}/bin"
        if [ ! -x "$${NODE_BIN}/yarn" ]; then
          NODE_BIN="$$(find "$${NVM_DIR}/versions/node" -maxdepth 2 -type f -name yarn -printf "%h\n" 2>/dev/null | sort -V | tail -n 1)"
        fi
        export PATH="/usr/local/bin:/home/frappe/.local/bin:/home/frappe/.pyenv/shims:/home/frappe/.pyenv/bin:$${NODE_BIN}:$${PATH}"
        echo "bench: $$(command -v bench || true)"
        echo "node: $$(command -v node || true)"
        echo "yarn: $$(command -v yarn || true)"

        SITE_NAME="$${SITE_NAME:-hrms.localhost}"
        ADMIN_PASSWORD="$${ADMIN_PASSWORD:-admin}"
        MYSQL_ROOT_PASSWORD="$${MYSQL_ROOT_PASSWORD:-123}"
        DEVELOPER_MODE="$${DEVELOPER_MODE:-0}"
        HRMS_GIT_URL="$${HRMS_GIT_URL:-https://github.com/syntaxusman/erphrm.git}"
        HRMS_BRANCH="$${HRMS_BRANCH:-develop}"
        HRMS_APP_DIR="$${HRMS_APP_DIR:-hrms}"
        BENCH_DIR="/home/frappe/frappe-bench"
        INIT_DIR="/tmp/frappe-bench-init"

        if [ -d "$${BENCH_DIR}/apps/frappe" ] && [ -f "$${BENCH_DIR}/sites/common_site_config.json" ] && [ -f "$${BENCH_DIR}/sites/$${SITE_NAME}/site_config.json" ] && "$${BENCH_DIR}/env/bin/python" -c "import frappe" >/dev/null 2>&1; then
          echo "Bench already exists, starting"
          cd "$${BENCH_DIR}"
          printf "frappe\nerpnext\nhrms\n" > sites/apps.txt
          bench use "$${SITE_NAME}"
          bench --site "$${SITE_NAME}" set-config host_name "https://$${SITE_NAME}"
          if [ ! -d "apps/$${HRMS_APP_DIR}" ]; then
            echo "HRMS app missing from existing bench; cloning $${HRMS_GIT_URL} branch $${HRMS_BRANCH}"
            git clone --depth 1 --branch "$${HRMS_BRANCH}" "$${HRMS_GIT_URL}" "apps/$${HRMS_APP_DIR}"
          else
            echo "Updating HRMS app from $${HRMS_GIT_URL} branch $${HRMS_BRANCH}"
            git -C "apps/$${HRMS_APP_DIR}" remote set-url upstream "$${HRMS_GIT_URL}" 2>/dev/null || git -C "apps/$${HRMS_APP_DIR}" remote add upstream "$${HRMS_GIT_URL}"
            git -C "apps/$${HRMS_APP_DIR}" fetch upstream "$${HRMS_BRANCH}" --depth 1
            git -C "apps/$${HRMS_APP_DIR}" checkout -B "$${HRMS_BRANCH}" "upstream/$${HRMS_BRANCH}"
          fi
          "$${BENCH_DIR}/env/bin/python" -m pip install --quiet -e "$${BENCH_DIR}/apps/$${HRMS_APP_DIR}"
          if [ -f "apps/$${HRMS_APP_DIR}/package.json" ]; then
            yarn --cwd "apps/$${HRMS_APP_DIR}" install --check-files
          fi
          if [ -f "apps/$${HRMS_APP_DIR}/frontend/package.json" ]; then
            yarn --cwd "apps/$${HRMS_APP_DIR}/frontend" install --check-files
          fi
          if [ -f "apps/$${HRMS_APP_DIR}/roster/package.json" ]; then
            yarn --cwd "apps/$${HRMS_APP_DIR}/roster" install --check-files
          fi
          bench build --app hrms
          if ! bench --site "$${SITE_NAME}" list-apps | grep -qx "hrms"; then
            echo "Installing HRMS on existing site $${SITE_NAME}"
            bench --site "$${SITE_NAME}" install-app hrms
          fi
          bench --site "$${SITE_NAME}" migrate
          bench --site "$${SITE_NAME}" clear-cache
          bench start
        fi

        if [ -d "$${BENCH_DIR}/apps/frappe" ]; then
          echo "Existing bench is incomplete, has a broken Python environment, or is missing site $${SITE_NAME}; recreating"
        fi

        echo "Waiting for MariaDB and Redis"
        for i in $$(seq 1 60); do
          timeout 2 bash -c "</dev/tcp/mariadb/3306" && timeout 2 bash -c "</dev/tcp/redis/6379" && break
          sleep 2
        done

        echo "Creating new bench"
        if [ -d "$${BENCH_DIR}" ]; then
          find "$${BENCH_DIR}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        fi
        rm -rf "$${INIT_DIR}"

        bench init --skip-redis-config-generation "$${INIT_DIR}"
        cp -R "$${INIT_DIR}/." "$${BENCH_DIR}/"
        rm -rf "$${INIT_DIR}"
        cd "$${BENCH_DIR}"
        "$${BENCH_DIR}/env/bin/python" -m pip install --quiet -e "$${BENCH_DIR}/apps/frappe"

        bench set-mariadb-host mariadb
        bench set-redis-cache-host redis://redis:6379
        bench set-redis-queue-host redis://redis:6379
        bench set-redis-socketio-host redis://redis:6379

        sed -i "/redis/d" ./Procfile
        sed -i "/watch/d" ./Procfile

        bench get-app erpnext
        if [ ! -d "apps/$${HRMS_APP_DIR}" ]; then
          echo "Cloning HRMS app from $${HRMS_GIT_URL} branch $${HRMS_BRANCH}"
          git clone --depth 1 --branch "$${HRMS_BRANCH}" "$${HRMS_GIT_URL}" "apps/$${HRMS_APP_DIR}"
        fi
        printf "frappe\nerpnext\nhrms\n" > sites/apps.txt
        "$${BENCH_DIR}/env/bin/python" -m pip install --quiet -e "$${BENCH_DIR}/apps/$${HRMS_APP_DIR}"
        if [ -f "apps/$${HRMS_APP_DIR}/package.json" ]; then
          yarn --cwd "apps/$${HRMS_APP_DIR}" install --check-files
        fi
        if [ -f "apps/$${HRMS_APP_DIR}/frontend/package.json" ]; then
          yarn --cwd "apps/$${HRMS_APP_DIR}/frontend" install --check-files
        fi
        if [ -f "apps/$${HRMS_APP_DIR}/roster/package.json" ]; then
          yarn --cwd "apps/$${HRMS_APP_DIR}/roster" install --check-files
        fi
        bench build --app hrms

        if [ ! -f "sites/$${SITE_NAME}/site_config.json" ]; then
          bench new-site "$${SITE_NAME}" \
            --force \
            --mariadb-root-password "$${MYSQL_ROOT_PASSWORD}" \
            --admin-password "$${ADMIN_PASSWORD}" \
            --no-mariadb-socket
        else
          echo "Site $${SITE_NAME} already exists, skipping site creation"
        fi

        if ! bench --site "$${SITE_NAME}" list-apps | grep -qx "erpnext"; then
          bench --site "$${SITE_NAME}" install-app erpnext
        fi
        if ! bench --site "$${SITE_NAME}" list-apps | grep -qx "hrms"; then
          bench --site "$${SITE_NAME}" install-app hrms
        fi

        bench --site "$${SITE_NAME}" set-config host_name "https://$${SITE_NAME}"
        bench --site "$${SITE_NAME}" set-config developer_mode "$${DEVELOPER_MODE}"
        bench --site "$${SITE_NAME}" enable-scheduler
        bench --site "$${SITE_NAME}" clear-cache
        bench use "$${SITE_NAME}"

        bench start
        '
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SHELL=/bin/bash
      - SITE_NAME=${SITE_NAME:?Set your public Frappe site/domain, for example hrms.example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set a strong Frappe Administrator password in Coolify}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set a strong MariaDB root password in Coolify}
      - DEVELOPER_MODE=${DEVELOPER_MODE:-0}
      - HRMS_GIT_URL=${HRMS_GIT_URL:-https://github.com/syntaxusman/erphrm.git}
      - HRMS_BRANCH=${HRMS_BRANCH:-develop}
      - HRMS_APP_DIR=${HRMS_APP_DIR:-hrms}
    working_dir: /home/frappe
    volumes:
      - frappe-bench:/home/frappe/frappe-bench
    expose:
      - "8000"
      - "9000"

volumes:
  mariadb-data:
  frappe-bench:
