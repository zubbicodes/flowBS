services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a strong MariaDB root password in Coolify}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  frappe:
    image: frappe/bench:latest
    restart: on-failure:3
    user: root
    command:
      - bash
      - -lc
      - |
        set -e
        mkdir -p /home/frappe/frappe-bench
        chown -R frappe:frappe /home/frappe/frappe-bench
        if [ -d /workspace/hrms ]; then
          for dependency_dir in \
            /workspace/hrms/node_modules \
            /workspace/hrms/frontend/node_modules \
            /workspace/hrms/roster/node_modules \
            /workspace/hrms/raven/node_modules \
            /workspace/hrms/raven/frontend/node_modules \
            /workspace/hrms/raven/apps/mobile/node_modules; do
            if [ -d "$${dependency_dir}" ]; then
              chown -R frappe:frappe "$${dependency_dir}"
            fi
          done
        fi
        ln -sf /home/frappe/.local/bin/bench /usr/local/bin/bench
        NODE_BIN="$$(find /home/frappe/.nvm/versions/node -maxdepth 2 -type f -name yarn -printf "%h\n" 2>/dev/null | sort -V | tail -n 1)"
        if [ -n "$${NODE_BIN}" ]; then
          ln -sf "$${NODE_BIN}/node" /usr/local/bin/node
          ln -sf "$${NODE_BIN}/npm" /usr/local/bin/npm
          ln -sf "$${NODE_BIN}/yarn" /usr/local/bin/yarn
        fi
        exec su frappe -s /bin/bash -c '
        set -e
        export HOME="/home/frappe"
        export NVM_DIR="$${NVM_DIR:-/home/frappe/.nvm}"
        if [ -s "$${NVM_DIR}/nvm.sh" ]; then
          . "$${NVM_DIR}/nvm.sh"
        fi
        NODE_BIN="$${NVM_DIR}/versions/node/v$${NODE_VERSION_DEVELOP}/bin"
        if [ ! -x "$${NODE_BIN}/yarn" ]; then
          NODE_BIN="$$(find "$${NVM_DIR}/versions/node" -maxdepth 2 -type f -name yarn -printf "%h\n" 2>/dev/null | sort -V | tail -n 1)"
        fi
        export PATH="/usr/local/bin:/home/frappe/.local/bin:/home/frappe/.pyenv/shims:/home/frappe/.pyenv/bin:$${NODE_BIN}:$${PATH}"
        echo "bench: $$(command -v bench || true)"
        echo "node: $$(command -v node || true)"
        echo "yarn: $$(command -v yarn || true)"

        SITE_NAME="$${SITE_NAME:-hrms.localhost}"
        FLOW_SITE_URL="$${FLOW_SITE_URL:-https://$${SITE_NAME}}"
        FLOW_SUPPORT_EMAIL="$${FLOW_SUPPORT_EMAIL:-support@flow.local}"
        ADMIN_PASSWORD="$${ADMIN_PASSWORD:-admin}"
        MYSQL_ROOT_PASSWORD="$${MYSQL_ROOT_PASSWORD:-123}"
        DEVELOPER_MODE="$${DEVELOPER_MODE:-0}"
        HRMS_GIT_URL="$${HRMS_GIT_URL:-https://github.com/zubbicodes/erphrm.git}"
        HRMS_BRANCH="$${HRMS_BRANCH:-develop}"
        HRMS_APP_DIR="$${HRMS_APP_DIR:-hrms}"
        HRMS_MOUNT_DIR="$${HRMS_MOUNT_DIR:-}"
        RAVEN_GIT_URL="$${RAVEN_GIT_URL:-https://github.com/syntaxusman/raven.git}"
        RAVEN_BRANCH="$${RAVEN_BRANCH:-develop}"
        RAVEN_APP_DIR="$${RAVEN_APP_DIR:-raven}"
        RAVEN_MOUNT_DIR="$${RAVEN_MOUNT_DIR:-}"
        RAVEN_BUILD_ASSETS="$${RAVEN_BUILD_ASSETS:-1}"
        FAST_START="$${FAST_START:-0}"
        BENCH_DIR="/home/frappe/frappe-bench"
        INIT_DIR="/tmp/frappe-bench-init"

        ensure_app_checkout() {
          app_dir="$$1"
          git_url="$$2"
          branch="$$3"
          mount_dir="$${4:-}"

          if [ -L "apps/$${app_dir}" ] && [ ! -e "apps/$${app_dir}" ]; then
            rm -f "apps/$${app_dir}"
          fi

          if [ -n "$${mount_dir}" ] && [ -f "$${mount_dir}/pyproject.toml" ]; then
            echo "Using mounted app $${app_dir} from $${mount_dir}"
            rm -rf "apps/$${app_dir}"
            ln -s "$${mount_dir}" "apps/$${app_dir}"
            return
          fi

          if [ ! -d "apps/$${app_dir}" ]; then
            echo "Cloning $${app_dir} app from $${git_url} branch $${branch}"
            git clone --depth 1 --branch "$${branch}" "$${git_url}" "apps/$${app_dir}"
          elif [ -d "apps/$${app_dir}/.git" ]; then
            echo "Updating $${app_dir} app from $${git_url} branch $${branch}"
            git -C "apps/$${app_dir}" remote set-url upstream "$${git_url}" 2>/dev/null || git -C "apps/$${app_dir}" remote add upstream "$${git_url}"
            git -C "apps/$${app_dir}" fetch upstream "$${branch}" --depth 1
            git -C "apps/$${app_dir}" checkout -B "$${branch}" "upstream/$${branch}"
          else
            echo "Using existing apps/$${app_dir}"
          fi
        }

        install_python_app() {
          app_dir="$$1"
          "$${BENCH_DIR}/env/bin/python" -m pip install --quiet -e "$${BENCH_DIR}/apps/$${app_dir}"
        }

        app_installed() {
          bench --site "$${SITE_NAME}" list-apps | awk "{print \$$1}" | grep -qx "$$1"
        }

        configure_runtime() {
          # bench init defaults to developer mode. Realtime authentication uses
          # the global value and otherwise rewrites the public HTTPS origin to
          # the internal webserver port.
          bench set-config -g developer_mode "$${DEVELOPER_MODE}"
          bench set-config -g webserver_host "http://127.0.0.1"
          bench set-config -g webserver_port 8000
        }

        build_raven_assets() {
          if [ ! -f "apps/$${RAVEN_APP_DIR}/package.json" ]; then
            echo "Raven package.json not found, skipping Raven frontend asset build"
            return
          fi

          (
            cd "apps/$${RAVEN_APP_DIR}"
            cp package.json package.json.raven-build-backup
            if [ -f yarn.lock ]; then
              cp yarn.lock yarn.lock.raven-build-backup
            fi
            restore_raven_package_files() {
              mv -f package.json.raven-build-backup package.json
              if [ -f yarn.lock.raven-build-backup ]; then
                mv -f yarn.lock.raven-build-backup yarn.lock
              fi
            }
            trap restore_raven_package_files EXIT

            node -e "const fs = require(\"fs\"); const p = JSON.parse(fs.readFileSync(\"package.json\", \"utf8\")); if (Array.isArray(p.workspaces)) p.workspaces = p.workspaces.filter((workspace) => workspace !== \"apps/*\"); fs.writeFileSync(\"package.json\", JSON.stringify(p, null, 2) + \"\\n\");"
            yarn install --check-files --ignore-scripts --network-timeout 600000
            yarn build
          )
          bench build --app raven
        }

        if [ -d "$${BENCH_DIR}/apps/frappe" ] && [ -f "$${BENCH_DIR}/sites/common_site_config.json" ] && [ -f "$${BENCH_DIR}/sites/$${SITE_NAME}/site_config.json" ] && "$${BENCH_DIR}/env/bin/python" -c "import frappe" >/dev/null 2>&1; then
          echo "Bench already exists, starting"
          cd "$${BENCH_DIR}"
          printf "frappe\nerpnext\nhrms\n" > sites/apps.txt
          bench use "$${SITE_NAME}"
          configure_runtime
          bench --site "$${SITE_NAME}" set-config host_name "$${FLOW_SITE_URL}"
          bench --site "$${SITE_NAME}" set-config flow_site_url "$${FLOW_SITE_URL}"
          bench --site "$${SITE_NAME}" set-config flow_support_email "$${FLOW_SUPPORT_EMAIL}"
          ensure_app_checkout "$${HRMS_APP_DIR}" "$${HRMS_GIT_URL}" "$${HRMS_BRANCH}" "$${HRMS_MOUNT_DIR}"
          ensure_app_checkout "$${RAVEN_APP_DIR}" "$${RAVEN_GIT_URL}" "$${RAVEN_BRANCH}" "$${RAVEN_MOUNT_DIR}"
          printf "frappe\nerpnext\nhrms\nraven\n" > sites/apps.txt
          "$${BENCH_DIR}/env/bin/python" -m pip install --quiet -e "$${BENCH_DIR}/apps/$${HRMS_APP_DIR}"
          install_python_app "$${RAVEN_APP_DIR}"
          if [ "$${FAST_START}" = "1" ] && app_installed hrms && app_installed raven; then
            echo "FAST_START=1 and required apps are installed; starting bench without build/migrate"
            bench start
          fi
          if [ -f "apps/$${HRMS_APP_DIR}/package.json" ]; then
            yarn --cwd "apps/$${HRMS_APP_DIR}" install --check-files
          fi
          if [ -f "apps/$${HRMS_APP_DIR}/frontend/package.json" ]; then
            yarn --cwd "apps/$${HRMS_APP_DIR}/frontend" install --check-files
          fi
          if [ -f "apps/$${HRMS_APP_DIR}/roster/package.json" ]; then
            yarn --cwd "apps/$${HRMS_APP_DIR}/roster" install --check-files
          fi
          bench build --app hrms
          if [ "$${RAVEN_BUILD_ASSETS}" = "1" ]; then
            build_raven_assets
          else
            echo "Skipping Raven frontend asset build because RAVEN_BUILD_ASSETS=$${RAVEN_BUILD_ASSETS}"
          fi
          if ! app_installed hrms; then
            echo "Installing HRMS on existing site $${SITE_NAME}"
            bench --site "$${SITE_NAME}" install-app hrms
          fi
          if ! app_installed raven; then
            echo "Installing Raven on existing site $${SITE_NAME}"
            bench --site "$${SITE_NAME}" install-app raven
          fi
          bench --site "$${SITE_NAME}" migrate
          bench --site "$${SITE_NAME}" clear-cache
          bench start
        fi

        if [ -d "$${BENCH_DIR}/apps/frappe" ]; then
          echo "Existing bench is incomplete, has a broken Python environment, or is missing site $${SITE_NAME}; recreating"
        fi

        echo "Waiting for MariaDB and Redis"
        for i in $$(seq 1 60); do
          timeout 2 bash -c "</dev/tcp/mariadb/3306" && timeout 2 bash -c "</dev/tcp/redis/6379" && break
          sleep 2
        done

        echo "Creating new bench"
        if [ -d "$${BENCH_DIR}" ]; then
          find "$${BENCH_DIR}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        fi
        rm -rf "$${INIT_DIR}"

        bench init --skip-redis-config-generation "$${INIT_DIR}"
        cp -R "$${INIT_DIR}/." "$${BENCH_DIR}/"
        rm -rf "$${INIT_DIR}"
        cd "$${BENCH_DIR}"
        "$${BENCH_DIR}/env/bin/python" -m pip install --quiet -e "$${BENCH_DIR}/apps/frappe"

        bench set-mariadb-host mariadb
        bench set-redis-cache-host redis://redis:6379
        bench set-redis-queue-host redis://redis:6379
        bench set-redis-socketio-host redis://redis:6379
        configure_runtime

        sed -i "/redis/d" ./Procfile
        sed -i "/watch/d" ./Procfile

        bench get-app erpnext
        ensure_app_checkout "$${HRMS_APP_DIR}" "$${HRMS_GIT_URL}" "$${HRMS_BRANCH}" "$${HRMS_MOUNT_DIR}"
        ensure_app_checkout "$${RAVEN_APP_DIR}" "$${RAVEN_GIT_URL}" "$${RAVEN_BRANCH}" "$${RAVEN_MOUNT_DIR}"
        printf "frappe\nerpnext\nhrms\nraven\n" > sites/apps.txt
        "$${BENCH_DIR}/env/bin/python" -m pip install --quiet -e "$${BENCH_DIR}/apps/$${HRMS_APP_DIR}"
        install_python_app "$${RAVEN_APP_DIR}"
        if [ -f "apps/$${HRMS_APP_DIR}/package.json" ]; then
          yarn --cwd "apps/$${HRMS_APP_DIR}" install --check-files
        fi
        if [ -f "apps/$${HRMS_APP_DIR}/frontend/package.json" ]; then
          yarn --cwd "apps/$${HRMS_APP_DIR}/frontend" install --check-files
        fi
        if [ -f "apps/$${HRMS_APP_DIR}/roster/package.json" ]; then
          yarn --cwd "apps/$${HRMS_APP_DIR}/roster" install --check-files
        fi
        bench build --app hrms
        if [ "$${RAVEN_BUILD_ASSETS}" = "1" ]; then
          build_raven_assets
        else
          echo "Skipping Raven frontend asset build because RAVEN_BUILD_ASSETS=$${RAVEN_BUILD_ASSETS}"
        fi

        if [ ! -f "sites/$${SITE_NAME}/site_config.json" ]; then
          bench new-site "$${SITE_NAME}" \
            --force \
            --mariadb-root-password "$${MYSQL_ROOT_PASSWORD}" \
            --admin-password "$${ADMIN_PASSWORD}" \
            --no-mariadb-socket
        else
          echo "Site $${SITE_NAME} already exists, skipping site creation"
        fi

        if ! app_installed erpnext; then
          bench --site "$${SITE_NAME}" install-app erpnext
        fi
        if ! app_installed hrms; then
          bench --site "$${SITE_NAME}" install-app hrms
        fi
        if ! app_installed raven; then
          bench --site "$${SITE_NAME}" install-app raven
        fi

        bench --site "$${SITE_NAME}" set-config host_name "$${FLOW_SITE_URL}"
        bench --site "$${SITE_NAME}" set-config flow_site_url "$${FLOW_SITE_URL}"
        bench --site "$${SITE_NAME}" set-config flow_support_email "$${FLOW_SUPPORT_EMAIL}"
        bench --site "$${SITE_NAME}" set-config developer_mode "$${DEVELOPER_MODE}"
        bench --site "$${SITE_NAME}" enable-scheduler
        bench --site "$${SITE_NAME}" migrate
        bench --site "$${SITE_NAME}" clear-cache
        bench use "$${SITE_NAME}"

        bench start
        '
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SHELL=/bin/bash
      - SITE_NAME=${SITE_NAME:?Set your public Frappe site/domain, for example hrms.example.com}
      - FLOW_SITE_URL=${FLOW_SITE_URL:?Set the public FLOW URL, for example https://flow.example.com}
      - FLOW_SUPPORT_EMAIL=${FLOW_SUPPORT_EMAIL:?Set the public FLOW support email}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set a strong Frappe Administrator password in Coolify}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set a strong MariaDB root password in Coolify}
      - DEVELOPER_MODE=${DEVELOPER_MODE:-0}
      - HRMS_GIT_URL=${HRMS_GIT_URL:-https://github.com/zubbicodes/erphrm.git}
      - HRMS_BRANCH=${HRMS_BRANCH:-develop}
      - HRMS_APP_DIR=${HRMS_APP_DIR:-hrms}
      - HRMS_MOUNT_DIR=${HRMS_MOUNT_DIR:-}
      - RAVEN_GIT_URL=${RAVEN_GIT_URL:-https://github.com/syntaxusman/raven.git}
      - RAVEN_BRANCH=${RAVEN_BRANCH:-develop}
      - RAVEN_APP_DIR=${RAVEN_APP_DIR:-raven}
      - RAVEN_MOUNT_DIR=${RAVEN_MOUNT_DIR:-}
      - RAVEN_BUILD_ASSETS=${RAVEN_BUILD_ASSETS:-1}
      - FAST_START=${FAST_START:-0}
    working_dir: /home/frappe
    volumes:
      - frappe-bench:/home/frappe/frappe-bench
    expose:
      - "8000"
      - "9000"

  gateway:
    build:
      context: ./docker
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      - frappe
    expose:
      - "8080"

volumes:
  mariadb-data:
  frappe-bench:
